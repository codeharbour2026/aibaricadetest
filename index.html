<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basic Robots.txt Converter</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 120px; font-family: monospace; }
    fieldset { margin-bottom: 20px; padding: 15px; }
    pre { background: #f4f4f4; padding: 15px; font-family: monospace; white-space: pre-wrap; }
    .check { display: block; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>Basic Robots.txt Converter</h1>
  
  <form id="converter-form">
    <fieldset>
      <legend>Existing robots.txt</legend>
      <label for="existing">Paste current content:</label>
      <textarea id="existing" placeholder="# Paste existing rules here..."></textarea>
    </fieldset>

    <fieldset>
      <legend>Select Crawlers to Block</legend>
      <div id="crawler-list"></div>
    </fieldset>

    <button type="submit">Generate Output</button>
  </form>

  <h2>Result Preview</h2>
  <pre id="output"></pre>

  <script src="crawlers.js"></script>
  <script>
    (function () {
      var box = document.getElementById('crawler-list');

      // Render checkboxes from CRAWLERS
      window.CRAWLERS.forEach(function (c) {
        var label = document.createElement('label');
        label.className = 'check';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = c.token;
        cb.name = 'crawler';

        var text = document.createElement('span');
        text.textContent = ' ' + c.token + ' (' + c.operator + ')';

        label.appendChild(cb);
        label.appendChild(text);
        box.appendChild(label);
      });

      // Handle form generation
      document.getElementById('converter-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var existingText = document.getElementById('existing').value.trim();
        var checkedBoxes = document.querySelectorAll('input[name="crawler"]:checked');
        
        var newLines = [];
        checkedBoxes.forEach(function (cb) {
          newLines.push('User-agent: ' + cb.value);
          newLines.push('Disallow: /');
          newLines.push('');
        });

        var combined = existingText;
        if (existingText && newLines.length) {
          combined += '\n\n';
        }
        combined += newLines.join('\n');

        document.getElementById('output').textContent = combined.trim();
      });
    })();
  </script>
</body>
</html>
